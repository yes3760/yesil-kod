<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Yeşil Kod · Video brifi</title>
<link rel="stylesheet" href="/stant/kaynak/ortak.css">
<style>
/* İçerik stant/film/video-prompt.md dosyasından üretilir (hazirla.py). */
@page{size:210mm 297mm;margin:16mm 16mm 14mm}
@page:first{margin-top:12mm}
body{font:400 8.9pt/1.52 var(--sans);color:var(--ink2)}
.bar{display:flex;justify-content:space-between;align-items:center;padding-bottom:4mm;border-bottom:.35mm solid var(--ink);margin-bottom:6mm}
.bar .word{font-size:15pt}
.bar > span{font:600 6.6pt/1 var(--mono);letter-spacing:.08em;color:var(--ink3)}
h1{font:700 20pt/1.15 var(--sans);letter-spacing:-.01em;color:var(--ink);margin-bottom:3mm}
h2{font:700 13pt/1.2 var(--sans);color:var(--ink);margin:7mm 0 2.5mm;padding-top:4mm;border-top:.35mm solid var(--ink);break-after:avoid}
h3{font:700 10pt/1.3 var(--sans);color:var(--ink);margin:4mm 0 1.5mm;break-after:avoid}
p{margin:1.8mm 0}
p:has(> strong:only-child){break-after:avoid}
p strong, li strong, td strong{color:var(--ink);font-weight:600}
ul, ol{margin:1.5mm 0 1.5mm 4.5mm}
li{margin:.8mm 0}
hr{display:none}
code{font-family:var(--mono);font-size:7.6pt;background:var(--well);padding:.2mm 1.1mm;border-radius:1mm;color:var(--ink)}
pre{background:var(--ink);color:var(--mist2);border-radius:2mm;padding:3.4mm 4mm;margin:1.5mm 0 3mm;white-space:pre-wrap;break-inside:avoid}
pre code{background:none;color:inherit;padding:0;font-size:7.6pt;line-height:1.6;font-stretch:87.5%}
table{width:100%;border-collapse:collapse;margin:2mm 0 3mm;font-size:8pt;line-height:1.4}
th{text-align:left;font:600 6.6pt/1.2 var(--mono);letter-spacing:.05em;color:var(--ink3);padding:0 2mm 1.5mm 0;border-bottom:.35mm solid var(--ink)}
td{padding:1.7mm 2mm 1.7mm 0;border-bottom:.2mm solid var(--rule);vertical-align:top}
td:first-child{font-family:var(--mono);font-size:7.2pt;color:var(--ink);white-space:nowrap}
tr{break-inside:avoid}
blockquote{background:var(--paper);border-left:1mm solid var(--moss);border-radius:0 2mm 2mm 0;padding:2.5mm 4.5mm;margin:2mm 0;color:var(--ink);font-size:9.4pt;line-height:1.6;break-inside:avoid}
blockquote p{margin:1.4mm 0}
</style>
</head>
<body>
<div class="bar"><div class="word">yeşil<span>kod</span></div><span>VİDEO BRİFİ · {{etkinlik}}</span></div>
{{video_md}}
</body>
</html>
