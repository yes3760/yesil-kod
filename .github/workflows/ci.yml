# Her push ve pull request'te: testler, Yeşil Kod'un kendi kodunu denetlemesi
# ve sitedeki (docs/py) motorun asıl kodla aynı olduğunun kontrolü.
name: Testler

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Birim testleri
        run: python -m unittest discover -s tests -v

      - name: Yeşil Kod kendi kodunu denetliyor
        run: |
          python -m greencode rapor greencode/ --bicim md >> "$GITHUB_STEP_SUMMARY"
          python -m greencode rapor greencode/ --esik 0 > /dev/null

      - name: Sitedeki motor güncel mi
        if: matrix.python-version == '3.13'
        run: |
          python stant/hazirla.py site
          git diff --exit-code docs/py
